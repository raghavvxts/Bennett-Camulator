services:
  - type: web
    name: bennett-camulator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    disk:
      name: camulator-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CAMULATOR_DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PARENT_EMAIL
        sync: false
      - key: PARENT_PASSWORD
        sync: false
      - key: API_SECRET_KEY
        sync: false
